name: Refresh NeetCode stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neetcode-stats.yml'
      - 'scripts/update_neetcode.py'
      - 'scripts/build_assets.py'
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

concurrency:
  group: neetcode-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public profile card
        run: python3 scripts/update_neetcode.py
      - name: Commit updated card
        run: |
          if git diff --quiet -- assets/neetcode.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neetcode.svg
          git commit -m "chore: refresh NeetCode profile stats"
          git push
